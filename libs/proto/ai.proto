syntax = "proto3";

package wertbot.ai;

option java_package = "ai.wertbot.ai";

// =============================================================================
// WertBot — AI Service gRPC Interface
// =============================================================================

service AiService {
  rpc Chat              (ChatRequest)         returns (ChatResponse);
  rpc EnrichTransaction (EnrichRequest)       returns (EnrichResponse);
  rpc GenerateBudgetAlert(BudgetAlertRequest)  returns (BudgetAlertResponse);
}

message ChatMessage {
  string role = 1;      // "user" or "model"
  string content = 2;
  int64 timestamp = 3;
}

message ChatRequest {
  string session_type = 1;      // e.g., "budget_advisor", "investment_advisor"
  repeated ChatMessage messages = 2;
  string user_message = 3;
  string user_context_json = 4; // Optional JSON string containing financial context
  string user_id = 5;
  string session_id = 6;
}

message ChatResponse {
  string response = 1;
  int32 tokens_used = 2;
}

message EnrichRequest {
  string merchant_name = 1;
  string merchant_mcc = 2;
  int64 amount_minor = 3;
  string currency = 4;
  string raw_sms_text = 5;
}

message EnrichResponse {
  string category = 1;
  string subcategory = 2;
  string merchant_type = 3;
  bool is_recurring = 4;
  string gemini_summary = 5;
}

message BudgetAlertRequest {
  string category = 1;
  double percentage_used = 2;
  int64 budget_amount_minor = 3;
  int64 spent_minor = 4;
  string currency = 5;
  string best_card_name = 6;
  double cashback_estimate = 7;
}

message BudgetAlertResponse {
  string alert_message = 1;
}
