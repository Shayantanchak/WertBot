# =============================================================================
# WertBot — Nginx Reverse Proxy Configuration
# Routes to NestJS microservices, handles SSL termination (via Certbot/Cloudflare)
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_trading:10m rate=500r/m;

# Upstream: API Gateway
upstream api_gateway {
    least_conn;
    server api-gateway:3000;
    keepalive 32;
}

# Upstream: WebSocket (Trading)
upstream trading_ws {
    server trading-service:3003;
    keepalive 16;
}

server {
    listen 80;
    server_name wertbot.ai www.wertbot.ai;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wertbot.ai www.wertbot.ai;

    # ── SSL / TLS ─────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/wertbot.ai.crt;
    ssl_certificate_key /etc/ssl/private/wertbot.ai.key;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:" always;

    # ── Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Static Frontend (React App) ────────────────────────────────────────
    location / {
        root /var/www/wertbot;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── API Gateway ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ── Auth endpoints — strict rate limiting ──────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket: Live Trading Streams ────────────────────────────────────
    location /ws/trading {
        limit_req zone=api_trading burst=20 nodelay;

        proxy_pass http://trading_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # Keep WS alive for 1 hour
        proxy_send_timeout 3600s;
    }

    # ── Health Check endpoint ──────────────────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://api_gateway/api/v1/health;
        proxy_http_version 1.1;
    }
}
