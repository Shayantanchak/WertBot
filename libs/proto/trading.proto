syntax = "proto3";

package wertbot.trading;

option java_package = "ai.wertbot.trading";

// =============================================================================
// WertBot — Trading gRPC Service Definition
// =============================================================================

service TradingService {
  rpc PlaceOrder       (PlaceOrderRequest)     returns (OrderResponse);
  rpc CancelOrder      (CancelOrderRequest)    returns (OrderResponse);
  rpc GetOrder         (GetOrderRequest)       returns (OrderResponse);
  rpc ListOrders       (ListOrdersRequest)     returns (ListOrdersResponse);
  rpc GetPortfolio     (GetPortfolioRequest)   returns (PortfolioResponse);
  rpc GetPricePrediction (PredictionRequest)   returns (PredictionResponse);
  rpc StreamPriceTicks (StreamTicksRequest)    returns (stream TickResponse);
}

message PlaceOrderRequest {
  string user_id      = 1;
  string symbol       = 2;
  string asset_class  = 3;
  string side         = 4;
  string order_type   = 5;
  string exchange     = 6;
  int64  quantity_minor = 7;
  string limit_price  = 8;
  string stop_price   = 9;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id  = 2;
}

message GetOrderRequest {
  string order_id = 1;
  string user_id  = 2;
}

message ListOrdersRequest {
  string user_id   = 1;
  string symbol    = 2;
  string status    = 3;
  int32  page      = 4;
  int32  limit     = 5;
}

message ListOrdersResponse {
  repeated OrderResponse orders = 1;
  int32 total    = 2;
  bool  has_next = 3;
}

message OrderResponse {
  string order_id              = 1;
  string user_id               = 2;
  string symbol                = 3;
  string side                  = 4;
  string order_type            = 5;
  string status                = 6;
  string exchange              = 7;
  int64  quantity_minor        = 8;
  int64  filled_quantity_minor = 9;
  string avg_fill_price        = 10;
  int64  fee_minor             = 11;
  string fee_currency          = 12;
  int64  placed_at             = 13;
  int64  filled_at             = 14;
}

message GetPortfolioRequest {
  string user_id = 1;
}

message PortfolioHolding {
  string symbol          = 1;
  string asset_class     = 2;
  string quantity        = 3;
  string avg_cost        = 4;
  string current_price   = 5;
  string market_value    = 6;
  double unrealized_pnl  = 7;
  double unrealized_pnl_pct = 8;
}

message PortfolioResponse {
  string user_id              = 1;
  repeated PortfolioHolding holdings = 2;
  string total_value          = 3;
  double total_unrealized_pnl = 4;
  double total_realized_pnl   = 5;
}

message PredictionRequest {
  string symbol      = 1;
  string asset_class = 2;
  string timeframe   = 3;
}

message PredictionResponse {
  string symbol       = 1;
  string direction    = 2;
  double confidence   = 3;
  string target_price = 4;
  string stop_loss    = 5;
  string reasoning    = 6;
  int64  generated_at = 7;
  double rsi          = 8;
  string macd_signal  = 9;
}

message StreamTicksRequest {
  repeated string symbols = 1;
  string user_id          = 2;
}

message TickResponse {
  string symbol      = 1;
  string exchange    = 2;
  string price       = 3;
  string volume      = 4;
  string bid         = 5;
  string ask         = 6;
  int64  timestamp   = 7;
  string asset_class = 8;
}
